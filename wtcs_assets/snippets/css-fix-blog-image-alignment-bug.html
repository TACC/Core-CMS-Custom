{% load sekizai_tags %}

{% addtoblock "css" %}
<style id="css-fix-blog-image-alignment-bug">
/* Hotfix for blog image alignment vs CMS Picture — see TACC/Core-CMS#1231 */
/* Remove once that PR is merged & deployed */

/* This CSS loads ON TOP of the currently-deployed (pre-fix) compiled CSS, */
/* which still matches `.align-*` on whatever element carries the class — */
/* the wrapped `<img>`, since TACC/Core-CMS#1127. Undo that old CSS's */
/* effect on the wrapped `<img>` before applying the new rules below, */
/* else its leftover float/clear/margin/max-width keeps showing through. */
article.post-detail .blog-content .align-left,
article.post-detail .blog-content .align-right {
  float: unset;
  clear: unset;
  max-width: unset;
  margin-left: unset;
  margin-right: unset;
}
article.post-detail .blog-content .align-center {
  /* FAQ: old rule only ever set `max-width`, never touched margin/float, */
  /* so leave Core-Styles' own `.align-center { margin-inline: auto }` alone */
  max-width: unset;
}

article.post-detail .blog-content :is(figure, a):has(> .align-left),
article.post-detail .blog-content img.align-left:not(:is(figure, a) > *) {
  float: left;
  clear: left;
  max-width: 85%;
  margin-right: calc(2 * var(--global-space--grid-gap, 30px));
}
article.post-detail .blog-content :is(figure, a):has(> .align-right),
article.post-detail .blog-content img.align-right:not(:is(figure, a) > *) {
  float: right;
  clear: right;
  max-width: 85%;
  margin-left: calc(2 * var(--global-space--grid-gap, 30px));
}
article.post-detail .blog-content :is(figure, a):has(> .align-center),
article.post-detail .blog-content img.align-center:not(:is(figure, a) > *) {
  max-width: 100%;
}

/* Neutralize Core-Styles' `.align-*` float/margin still on the wrapped <img>, */
/* else it double-floats inside its already-floated wrapper and keeps the */
/* wrapper from shrinking to the image's width (e.g. breaks caption width) */
article.post-detail .blog-content :is(figure, a) > .align-right,
article.post-detail .blog-content :is(figure, a) > .align-left {
  float: unset;
  clear: unset;
  max-width: unset;
  margin-inline: auto;
}

@media (min-width: 992px) {
  article.post-detail .blog-content :is(figure, a):has(> .align-left),
  article.post-detail .blog-content img.align-left:not(:is(figure, a) > *) {
    margin-left: -12vw;
  }
  article.post-detail .blog-content :is(figure, a):has(> .align-right),
  article.post-detail .blog-content img.align-right:not(:is(figure, a) > *) {
    margin-right: -12vw;
  }
}

@media (max-width: 991.98px) {
  article.post-detail .blog-content :is(figure, a):has(> .align-center),
  article.post-detail .blog-content img.align-center:not(:is(figure, a) > *),
  article.post-detail .blog-content :is(figure, a):has(> .align-right),
  article.post-detail .blog-content img.align-right:not(:is(figure, a) > *),
  article.post-detail .blog-content :is(figure, a):has(> .align-left),
  article.post-detail .blog-content img.align-left:not(:is(figure, a) > *) {
    max-width: 100%;
  }
  article.post-detail .blog-content :is(figure, a):has(> .align-center),
  article.post-detail .blog-content :is(figure, a):has(> .align-right),
  article.post-detail .blog-content :is(figure, a):has(> .align-left) {
    margin-inline: auto;
  }
  article.post-detail .blog-content a:has(> .align-center),
  article.post-detail .blog-content a:has(> .align-right),
  article.post-detail .blog-content a:has(> .align-left) {
    display: block;
    width: fit-content;
  }
  article.post-detail .blog-content :is(figure, a):has(> .align-right),
  article.post-detail .blog-content img.align-right:not(:is(figure, a) > *),
  article.post-detail .blog-content :is(figure, a):has(> .align-left),
  article.post-detail .blog-content img.align-left:not(:is(figure, a) > *) {
    float: unset;
  }
  article.post-detail .blog-content :is(figure, a):has(> .align-right),
  article.post-detail .blog-content img.align-right:not(:is(figure, a) > *) {
    margin-left: unset;
  }
  article.post-detail .blog-content :is(figure, a):has(> .align-left),
  article.post-detail .blog-content img.align-left:not(:is(figure, a) > *) {
    margin-right: unset;
  }
}
</style>
{% endaddtoblock %}
