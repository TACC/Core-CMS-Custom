name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release-as:
        description: "Optional version to release as when recovering a skipped release (for example, 1.17.0)."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-as: ${{ inputs.release-as }}
